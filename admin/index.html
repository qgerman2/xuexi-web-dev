<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editor · Xuexi Club UC</title>
<link rel="icon" href="../assets/logo.png">
<style>
  body{margin:0;font-family:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif}
  /* La portada de acceso. Decap pinta encima cuando la sesión es válida. */
  #puerta{min-height:100vh;display:grid;place-items:center;background:#1a1010;color:#f4ece0}
  #puerta.oculto{display:none}
  .caja{width:min(350px,88vw);display:grid;gap:12px}
  .caja h1{font-size:1.15rem;font-weight:600;margin:0;text-align:center}
  .caja .zh{color:#D4AF61}
  .caja p.sub{margin:0 0 6px;text-align:center;font-size:.82rem;opacity:.7}
  .caja label{font-size:.76rem;opacity:.8}
  .caja input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:7px;
    border:1px solid #4a3030;background:#241616;color:inherit;font:inherit}
  .caja button{padding:11px;border:0;border-radius:7px;background:#C0392B;color:#fff;
    font:inherit;font-weight:600;cursor:pointer}
  .caja button[disabled]{opacity:.6;cursor:default}
  .caja .secundario{background:transparent;border:1px solid #4a3030;color:#f4ece0}
  .msj{border-radius:7px;padding:9px 11px;font-size:.8rem;display:none}
  .msj.error{background:rgba(192,57,43,.18);border:1px solid #C0392B}
  .msj.aviso{background:rgba(212,175,97,.14);border:1px solid #D4AF61}
  .cargando{text-align:center;font-size:.85rem;opacity:.7}
</style>
</head>
<body>

<div id="puerta">
  <div class="caja">
    <h1><span class="zh">学习</span> Editor</h1>
    <p class="sub" id="sub">Comprobando sesión…</p>

    <div class="msj" id="msj"></div>

    <form id="form" hidden>
      <div style="display:grid;gap:12px">
        <div>
          <label for="correo">Correo electrónico</label>
          <input id="correo" type="email" required autocomplete="username">
        </div>
        <div>
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" required autocomplete="current-password">
        </div>
        <button id="entrar" type="submit">Entrar</button>
      </div>
    </form>

    <button id="salir" class="secundario" hidden type="button">Cerrar sesión</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../assets/firebase-config.js?v=30"></script>
<script src="../assets/evento-vista.js?v=30"></script>
<script src="preview-evento.js?v=1"></script>
<script>
/* Acceso al panel con la cuenta de Xuexi.
 *
 * Decap trae su propio botón de "entrar" que abre una ventana emergente. Aquí
 * no hace falta: si ya hay una sesión de coordinación, dejamos la credencial
 * donde Decap la busca (localStorage) ANTES de cargarlo, y arranca directo.
 *
 * Lo que guardamos es el idToken de Firebase, no un token de GitHub. El Worker
 * lo valida en cada petición y vuelve a comprobar el rol contra Firestore, así
 * que esto no concede nada que la persona no tuviera ya.
 *
 * El formato de abajo salió de iniciar sesión una vez por el camino normal y
 * mirar qué dejó Decap en localStorage. Si algún día se actualiza Decap y el
 * panel deja de arrancar solo, ese es el primer sitio donde mirar.
 */
(function(){
  'use strict';

  var CLAVE_DECAP = 'decap-cms-user';
  // Se rellena desde config.yml para no repetir la dirección en dos sitios.
  var WORKER = null;
  // Versión FIJA, no un rango. El panel inyecta valores en el formulario de
  // Decap buscando por el texto de las etiquetas (ver admin.html), así que
  // depende de su HTML. Con '^3.8.0' unpkg servía lo último que hubiera —
  // en octubre de 2026 ya era la 3.17.1 — y una actualización silenciosa
  // podía romper el panel sin que nadie hubiera tocado nada.
  // Al subir de versión: probar el acceso y la inyección antes de dejarlo.
  var DECAP_SRC = 'https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js';
  var ROL_REQUERIDO = 'admin';

  var puerta = document.getElementById('puerta'),
      form   = document.getElementById('form'),
      sub    = document.getElementById('sub'),
      msj    = document.getElementById('msj'),
      btn    = document.getElementById('entrar'),
      salir  = document.getElementById('salir');

  var decapCargado = false;

  // Cada etapa deja su rastro en pantalla. Entre entrar y ver el editor hay
  // tres viajes de red (Firestore, el conector, el paquete de Decap) y en una
  // conexión lenta eso son diez segundos largos: sin esto, parece colgado.
  var etapa = '';
  var vigilante = null;

  function paso(texto){
    etapa = texto;
    sub.textContent = texto;
    clearTimeout(vigilante);
    vigilante = setTimeout(function(){
      if (!puerta.classList.contains('oculto')) {
        decir('Sigue en «' + etapa + '» más de lo normal. Suele ser la red; '
              + 'déjalo un momento más. Si no avanza, recarga la página.', 'aviso');
      }
    }, 12000);
  }

  function decir(texto, clase){
    msj.textContent = texto;
    msj.className = 'msj ' + (clase || 'error');
    msj.style.display = texto ? 'block' : 'none';
  }

  function pedirCredenciales(texto){
    sub.textContent = 'Entra con tu cuenta de miembro.';
    form.hidden = false;
    salir.hidden = true;
    btn.disabled = false;
    btn.textContent = 'Entrar';
    if (texto) decir(texto);
  }

  // El id publicado también nombra el archivo y las fotos: no se renombra.
  function bloquearIdentificador(){
    var existente = /^#\/collections\/agenda\/entries\//.test(location.hash);
    var etiqueta = [].slice.call(document.querySelectorAll('label')).find(function(l){
      return /^identificador/i.test(l.textContent.trim());
    });
    var input = etiqueta && document.getElementById(etiqueta.htmlFor);
    if (!input) return;
    var bloqueado = existente || input.dataset.importandoInstagram === 'true';
    if (input.readOnly !== bloqueado) input.readOnly = bloqueado;
    input.setAttribute('aria-readonly', String(bloqueado));
    var aviso = document.getElementById('aviso-identificador');
    if (existente && !aviso){
      aviso = document.createElement('p');
      aviso.id = 'aviso-identificador';
      aviso.textContent = 'El identificador no se puede cambiar después de publicar.';
      aviso.style.cssText = 'font-size:13px;color:#9b342b;margin:8px 0';
      input.insertAdjacentElement('afterend', aviso);
    }
    if (aviso && !existente) aviso.remove();
    var descritos = (input.getAttribute('aria-describedby') || '').split(/\s+/)
      .filter(function(id){ return id && id !== 'aviso-identificador'; });
    if (existente) descritos.push('aviso-identificador');
    if (descritos.length) input.setAttribute('aria-describedby', descritos.join(' '));
    else input.removeAttribute('aria-describedby');
  }
  new MutationObserver(bloquearIdentificador).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('hashchange', bloquearIdentificador);

  function cargarDecap(){
    if (decapCargado) return;
    decapCargado = true;
    clearTimeout(vigilante);
    sub.textContent = '';
    decir('');
    puerta.classList.add('oculto');
    // Registrar la vista antes de iniciar Decap evita la vista genérica inicial.
    window.CMS_MANUAL_INIT = true;
    var s = document.createElement('script');
    s.src = DECAP_SRC;
    s.onload = function(){
      try {
        window.registrarPreviewEvento(window.CMS);
        window.CMS.registerEventListener({ name: 'preSave', handler: function(event){
          if (event.entry.get('collection') === 'agenda'){
            window.parent.PanelXuexi?.validarImportacion(event.entry);
          }
        } });
        window.CMS.init();
      } catch(e){
        puerta.classList.remove('oculto');
        decir('No se pudo cargar el editor: ' + e.message);
      }
    };
    s.onerror = function(){
      puerta.classList.remove('oculto');
      decir('No se pudo descargar el editor. Recarga la página para reintentar.');
    };
    document.body.appendChild(s);
  }

  // Lee base_url de config.yml, para que la dirección del Worker viva en un
  // solo sitio.
  function direccionWorker(){
    if (WORKER) return Promise.resolve(WORKER);
    return fetch('config.yml', {cache: 'no-cache'})
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var m = txt.match(/^\s*base_url:\s*(\S+)/m);
        if (!m) throw new Error('config.yml no tiene base_url');
        WORKER = m[1].replace(/\/$/, '');
        return WORKER;
      });
  }

  // Cambia el idToken de Firebase (una hora) por una sesión del panel, que
  // dura lo que diga el Worker. Sin esto, una tarde de edición se cortaba a
  // la hora porque Decap se queda con una copia del token en memoria.
  function pedirSesion(user){
    return Promise.all([user.getIdToken(), direccionWorker()])
      .then(function(r){
        // Sin límite, una petición que nunca responde deja la pantalla fija.
        var corte = new AbortController();
        var reloj = setTimeout(function(){ corte.abort(); }, 25000);
        return fetch(r[1] + '/sesion', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + r[0] },
          signal: corte.signal
        }).then(function(x){ clearTimeout(reloj); return x; },
                function(e){ clearTimeout(reloj);
                  throw new Error(e.name === 'AbortError'
                    ? 'el conector no respondió en 25 segundos' : e.message); });
      })
      .then(function(resp){
        if (!resp.ok) throw new Error('El conector rechazó la sesión (' + resp.status + ')');
        return resp.json();
      })
      .then(function(d){
        if (!d.token) throw new Error('El conector no devolvió sesión');
        return d.token;
      });
  }

  // Deja la credencial donde Decap la lee al arrancar.
  function sembrarSesion(user, perfil){
    return pedirSesion(user).then(function(testigo){
      var nombre = perfil.nombre || user.email;
      localStorage.setItem(CLAVE_DECAP, JSON.stringify({
        name: nombre,
        login: nombre,          // esto es lo que acaba en {{author-login}}
        email: user.email,
        token: testigo,
        // Imprescindible: Decap descarta la sesión guardada si esto no
        // coincide con backend.name de config.yml. Sin este campo arranca
        // igualmente, pero mostrando "Iniciar sesión con GitHub".
        backendName: 'github'
      }));
      return testigo;
    });
  }

  // La sesión del panel dura horas, pero la renovamos a mitad de camino para
  // que recargar nunca pida entrar de nuevo. Decap conserva su copia en
  // memoria: esto sirve para la siguiente carga, no para la sesión en curso.
  function mantenerVivo(user, perfil){
    setInterval(function(){
      sembrarSesion(user, perfil).catch(function(){});
    }, 3 * 60 * 60 * 1000);
  }

  function comprobarRol(user){
    return firebase.firestore().collection('miembros').doc(user.uid).get()
      .then(function(doc){ return doc.exists ? doc.data() : null; });
  }

  if (!window.XUEXI_FIREBASE_CONFIG || typeof firebase === 'undefined' || !firebase.apps.length){
    sub.textContent = '';
    decir('El acceso no está configurado: revisa assets/firebase-config.js.');
    return;
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user){
      try { localStorage.removeItem(CLAVE_DECAP); } catch(e){}
      pedirCredenciales();
      return;
    }

    paso('Comprobando permisos…');
    form.hidden = true;

    comprobarRol(user).then(function(perfil){
      if (!perfil || perfil.rol !== ROL_REQUERIDO){
        sub.textContent = '';
        decir('Tu cuenta no tiene permisos de coordinación. Pide que te los den '
              + 'o entra con otra cuenta.', 'aviso');
        salir.hidden = false;
        return;
      }
      paso('Abriendo sesión con el conector…');
      return sembrarSesion(user, perfil).then(function(){
        paso('Cargando el editor…');
        mantenerVivo(user, perfil);
        cargarDecap();
      }).catch(function(e){
        // Aquí el perfil ya estaba bien: lo que falló es pedirle la sesión al
        // conector. "Failed to fetch" casi siempre significa que el Worker
        // desplegado todavía no tiene la ruta /sesion, o que este origen no
        // está en su lista de permitidos.
        clearTimeout(vigilante);
        sub.textContent = '';
        decir('No se pudo abrir sesión con el conector: ' + (e.message || e)
              + '. Comprueba que el Worker esté actualizado y que este origen '
              + 'esté en ORIGENES_PERMITIDOS.');
        salir.hidden = false;
      });
    }).catch(function(e){
      clearTimeout(vigilante);
      sub.textContent = '';
      decir('No se pudo comprobar tu perfil: ' + (e.message || e));
      salir.hidden = false;
    });
  });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    decir('');
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    firebase.auth().signInWithEmailAndPassword(
      document.getElementById('correo').value.trim(),
      document.getElementById('clave').value
    ).catch(function(e){
      pedirCredenciales(e.code === 'auth/invalid-credential'
        ? 'Correo o contraseña incorrectos.'
        : (e.message || 'No se pudo entrar.'));
    });
  });

  salir.addEventListener('click', function(){
    try { localStorage.removeItem(CLAVE_DECAP); } catch(e){}
    firebase.auth().signOut();
  });
})();
</script>
</body>
</html>
