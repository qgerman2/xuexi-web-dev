# Configuración del panel de edición (Decap CMS).
# Quien edita no necesita tocar este archivo: se maneja desde xuexiclub.cl/admin/
#
# El conector ya está desplegado. Lo único que falta para que el panel funcione
# son las claves de GitHub: ver admin/LEEME-instalacion.md

backend:
  name: github
  repo: qgerman2/xuexi-web-dev
  branch: main
  base_url: https://panel.qgerman2.workers.dev
  # Decap cree que esto es api.github.com. El Worker valida la sesión de
  # Xuexi y reenvía con el token del programa.
  api_root: https://panel.qgerman2.workers.dev/github
  commit_messages:
    update: 'Actualiza {{collection}} desde el panel ({{author-login}})'
    delete: 'Elimina de {{collection}} desde el panel ({{author-login}})'
    uploadMedia: 'Sube {{path}} desde el panel ({{author-login}})'
    deleteMedia: 'Borra {{path}} desde el panel ({{author-login}})'

locale: es
media_folder: assets
public_folder: assets

collections:
  # ─────────────────────────── EVENTOS ───────────────────────────
  # Un archivo por evento en data/eventos/. El nombre del archivo es el id,
  # que es la URL pública (/evento/<id>/) y la clave con la que se guardan sus
  # fotos. Al guardar, una GitHub Action junta todo en data/eventos.json y
  # vuelve a generar las páginas: ese archivo NO se edita desde aquí.
  - name: agenda
    label: Agenda
    label_singular: evento
    folder: data/eventos
    create: true
    extension: json
    format: json
    # El identificador es 'id', no el título: de ahí sale {{slug}}, que
    # nombra el archivo Y la carpeta de medios. Si fuera el título,
    # la carpeta llevaría acentos y hanzi, y se movería al reescribir
    # el título. En la lista se sigue viendo el título por 'summary'.
    identifier_field: id
    slug: '{{fields.id}}'
    summary: '{{fecha}} · {{titulo}}'
    # El objeto con default_sort lo admite Decap 3.10+; está fijada la 3.17.1.
    # 'desc' = lo más reciente arriba, que es como se trabaja la agenda.
    sortable_fields:
      - { field: fecha, default_sort: desc }
      - titulo
      - tipo
    # Cada evento sube sus fotos a su propia carpeta. Así el selector de
    # imágenes muestra SOLO las de este evento y no el repositorio entero:
    # en un evento nuevo aparece vacío, o sea, directo a "subir".
    # Ojo: {{slug}} es el Identificador, así que hay que rellenarlo ANTES
    # de subir nada, o las fotos acaban en una carpeta equivocada.
    media_folder: '/assets/eventos/{{slug}}'
    public_folder: 'assets/eventos/{{slug}}'
    description: >-
      Actividades del club. Los eventos con fecha pasada se mueven solos a
      "Eventos anteriores": no hay que borrarlos.
    fields:
      - label: Identificador
        name: id
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones. Ej. taller-caligrafia']
        hint: >-
          Es la dirección del evento (/evento/<id>/) y la clave de sus fotos.
          Córtalo: "cocina-china", no el título entero. NO LO CAMBIES una vez
          publicado: rompe los enlaces compartidos y deja las fotos huérfanas.
      - { label: Título, name: titulo, widget: string }
      - label: Fecha
        name: fecha
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD-MM-YYYY'
        time_format: false
        picker_utc: true
      - { label: Hora, name: hora, widget: string, required: false, hint: 'Ej. 18:30' }
      - { label: Lugar, name: lugar, widget: string, required: false }
      - { label: Detalle, name: detalle, widget: text, required: false }
      - label: Tipo
        name: tipo
        widget: select
        options:
          - { label: Taller, value: taller }
          - { label: Charla, value: charla }
          - { label: Congreso, value: congreso }
          - { label: Almuerzo, value: almuerzo }
          - { label: Festival, value: festival }
          - { label: Stand, value: stand }
          - { label: Jornada de investigación, value: jornada }
          - { label: Voluntariado, value: voluntariado }
      - label: Estado
        name: estado
        widget: select
        default: pronto
        options:
          - { label: Inscripción abierta, value: abierto }
          - { label: Próximamente, value: pronto }
          - { label: Cupos llenos, value: lleno }
          - { label: Online · abierto, value: online }
          - { label: Realizado, value: realizado }
      - label: Comisión
        name: comision
        widget: select
        required: false
        options:
          - { label: 学习 Xuexi · Conocimiento Académico, value: xuexi }
          - { label: 外联 Wailian · Idioma y Comunidad, value: wailian }
          - { label: 信息 Xinxi · Difusión y Diseño, value: xinxi }
      - { label: Área temática, name: areaEtiqueta, widget: string, required: false }
      - { label: Ciclo, name: ciclo, widget: string, required: false }
      - { label: Cupos, name: cupos, widget: number, required: false, default: 0, value_type: int, min: 0 }
      - { label: Carácter chino, name: hanzi, widget: string, required: false, hint: 'Se muestra si no hay imagen. Ej. 书' }
      - { label: Imagen de portada, name: imagen, widget: image, required: false, allow_multiple: false,
          hint: 'La que se ve en la agenda, encabeza la subpágina y sale al compartir el enlace.' }
      - label: Galería de fotos
        name: galeria
        widget: image
        required: false
        # Con allow_multiple se pueden elegir y subir varias de una vez, en
        # vez de abrir el selector foto por foto como con una lista.
        allow_multiple: true
        media_library:
          config:
            multiple: true
        hint: >-
          Fotos del evento. Puedes seleccionar varias a la vez. Aparecen en la
          subpágina del evento y en la página Galería.

  # ────────────────────────── REPORTAJES ─────────────────────────
  - name: investigacion
    label: Investigación
    files:
      - name: reportajes
        label: Reportajes
        file: data/reportajes.json
        format: json
        description: Columnas y reportajes publicados por la Comisión Xuexi.
        fields:
          - { name: _instrucciones, widget: hidden }
          - label: Áreas disponibles
            name: _areas
            widget: list
            hint: Áreas que aparecen como filtros. Cámbialas solo si es necesario.
          - label: Reportajes
            name: reportajes
            widget: list
            label_singular: reportaje
            summary: '{{fields.fecha}} · {{fields.titulo}}'
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Autor o autora, name: autor, widget: string }
              - { label: Descripción del autor, name: autorDetalle, widget: string, required: false, hint: 'Ej. Cientista Política UC.' }
              - label: Área
                name: area
                widget: select
                options:
                  - Economía y Negocios
                  - Ciencia y Tecnología
                  - RR.II. y Diplomacia
                  - Cultura, Arte y Lengua
                  - Políticas Públicas y Gobernanza
                  - Otros
              - { label: Tipo, name: tipo, widget: string, required: false, default: 'Columna de opinión' }
              - label: Fecha de publicación
                name: fecha
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'DD-MM-YYYY'
                time_format: false
                picker_utc: true
              - label: Fecha de recepción
                name: recibido
                widget: datetime
                required: false
                format: 'YYYY-MM-DD'
                date_format: 'DD-MM-YYYY'
                time_format: false
                picker_utc: true
              - { label: Resumen, name: resumen, widget: text, hint: 'Una o dos frases. Se muestra en el listado.' }
              - { label: Cita destacada, name: cita, widget: text, required: false, hint: 'Frase que se resalta dentro del texto.' }
              - label: Es solo un extracto
                name: extracto
                widget: boolean
                default: false
                hint: Actívalo si el texto está incompleto. Muestra un aviso al lector.
              - label: Párrafos
                name: parrafos
                widget: list
                label_singular: párrafo
                field: { label: Texto, name: texto, widget: text }
              - label: Palabras clave
                name: palabrasClave
                widget: list
                required: false
                label_singular: palabra clave
              - label: Fuente
                name: fuente
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Texto, name: texto, widget: string, required: false }
                  - { label: Enlace, name: url, widget: string, required: false }

  # ──────────────────────────── EQUIPO ───────────────────────────
  - name: equipo
    label: Equipo
    media_folder: /assets/equipo
    public_folder: assets/equipo
    files:
      - name: equipo
        label: Quiénes somos
        file: data/equipo.json
        format: json
        description: >-
          Coordinación y comisiones. Si alguien no tiene foto, se muestra un
          monograma con sus iniciales.
        fields:
          - { name: _instrucciones, widget: hidden }
          - { label: Período, name: periodo, widget: string, hint: 'Ej. 2026' }
          - label: Coordinación General
            name: coordinacion
            widget: object
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Nota, name: nota, widget: text, required: false }
              - label: Mesa directiva
                name: mesa
                widget: list
                label_singular: cargo
                summary: '{{fields.cargo}} · {{fields.nombre}}'
                fields:
                  - { label: Cargo, name: cargo, widget: string }
                  - { label: Nombre, name: nombre, widget: string }
                  - { label: Nombre en chino, name: hanzi, widget: string, required: false }
                  - { label: Carrera, name: carrera, widget: string, required: false }
                  - { label: Equipo, name: equipo, widget: string, required: false }
                  - { label: Correo, name: email, widget: string, required: false }
                  - { label: Foto, name: foto, widget: image, required: false }
              - label: Coordinaciones de comisión
                name: coordinadores
                widget: list
                label_singular: coordinación
                summary: '{{fields.cargo}} · {{fields.nombre}}'
                fields:
                  - { label: Cargo, name: cargo, widget: string }
                  - label: Comisión
                    name: comision
                    widget: select
                    required: false
                    options:
                      - { label: 学习 Xuexi, value: xuexi }
                      - { label: 外联 Wailian, value: wailian }
                      - { label: 信息 Xinxi, value: xinxi }
                      - { label: 读书 Club de lectura, value: lectura }
                  - { label: Nombre, name: nombre, widget: string }
                  - { label: Nombre en chino, name: hanzi, widget: string, required: false }
                  - { label: Carrera, name: carrera, widget: string, required: false }
                  - { label: Correo, name: email, widget: string, required: false }
                  - { label: Foto, name: foto, widget: image, required: false }
          - label: Comisiones
            name: comisiones
            widget: list
            label_singular: comisión
            summary: '{{fields.zh}} {{fields.nombre}}'
            fields:
              - { label: Identificador, name: id, widget: string }
              - { label: Nombre en chino, name: zh, widget: string }
              - { label: Pinyin, name: pinyin, widget: string, required: false }
              - { label: Nombre, name: nombre, widget: string }
              - { label: Nota, name: nota, widget: text, required: false }
              - label: Miembros
                name: miembros
                widget: list
                label_singular: miembro
                summary: '{{fields.nombre}}'
                fields:
                  - { label: Nombre, name: nombre, widget: string }
                  - { label: Nombre en chino, name: hanzi, widget: string, required: false }
                  - { label: Carrera, name: carrera, widget: string, required: false }
                  - { label: Foto, name: foto, widget: image, required: false }
          - label: Equipo fundador
            name: fundadores
            widget: object
            collapsed: true
            fields:
              - { label: Fecha, name: fecha, widget: string }
              - { label: Frase, name: cita, widget: text }
              - label: Nombres
                name: nombres
                widget: list
                label_singular: nombre
          - label: Historia
            name: historia
            widget: list
            required: false
            collapsed: true
            label_singular: período
            summary: '{{fields.periodo}}'
            fields:
              - { label: Período, name: periodo, widget: string }
              - label: Cargos
                name: cargos
                widget: list
                label_singular: cargo
                summary: '{{fields.cargo}} · {{fields.nombre}}'
                fields:
                  - { label: Cargo, name: cargo, widget: string }
                  - { label: Nombre, name: nombre, widget: string }
              - { label: Nota / Destinatario, name: nota, widget: string, required: false }

  # ────────────────────── MEMBRESÍAS Y PAGOS ──────────────────────
  - name: config_membresias
    label: Membresías y Pagos
    files:
      - name: configuracion_pagos
        label: Configuración de Cuotas y Pasarela
        file: data/membresias.json
        format: json
        description: Configuración del monto de la mensualidad y enlace de pago de Mercado Pago / Getnet
        fields:
          - { label: Link Mercado Pago - General / RM ($2.000), name: linkMercadoPagoGeneral, widget: string, hint: 'Link de pago para cuota General ($2.000 CLP)' }
          - { label: Valor Cuota General (número), name: montoGeneral, widget: number, value_type: int, default: 2000 }
          - { label: Link Mercado Pago - Regiones ($1.000), name: linkMercadoPagoRegion, widget: string, hint: 'Link de pago para miembros en regiones ($1.000 CLP)' }
          - { label: Valor Cuota Regiones (número), name: montoRegion, widget: number, value_type: int, default: 1000 }
          - { label: Día de Vencimiento Mensual, name: diaCobro, widget: number, value_type: int, default: 5, min: 1, max: 31 }
          - { label: Métodos de Pago Aceptados, name: metodosAceptados, widget: string, required: false }
          - { label: Instrucciones para el Miembro, name: instrucciones, widget: text, required: false }



